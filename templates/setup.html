<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup · STOCKFLOW V7</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="auth"><div class="auth-card"><div class="brand dark"><span class="brand-icon">▦</span><div><strong>STOCKFLOW</strong><small>FIRST-TIME SETUP</small></div></div><h1>Create Administrator</h1><p>สร้างบัญชี Admin แรกสำหรับฐานข้อมูลใหม่</p>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}<form method="post"><label>Admin username<input name="username" minlength="3" required></label><label>Password (12+ characters)<input name="password" type="password" minlength="12" required></label><button class="btn primary full">Create Admin →</button></form></div></body></html>
